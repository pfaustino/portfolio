<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Patrick Faustino — browser games, web apps, and prototypes. Play on GitHub Pages, itch.io, and Vercel." />
  <title>Patrick Faustino — Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Fredoka:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&family=JetBrains+Mono:wght@400;500&family=Orbitron:wght@600;700&family=Outfit:wght@400;500;600;700&family=Share+Tech+Mono&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <script>
    (function () {
      var allowed = ["midnight", "brutal", "aero", "glass", "chrome", "clay", "terminal", "lego"];
      try {
        var t = localStorage.getItem("portfolio-theme");
        document.documentElement.setAttribute("data-theme", allowed.indexOf(t) >= 0 ? t : "midnight");
      } catch (_) {
        document.documentElement.setAttribute("data-theme", "midnight");
      }
    })();
  </script>
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>

  <header class="site-header">
    <div class="container header-inner">
      <div class="brand">
        <p class="brand-eyebrow">Portfolio</p>
        <h1 class="brand-name">Patrick Faustino</h1>
        <p class="brand-bio" id="owner-bio">I build 3D browser games, interactive data stories, and Windows desktop apps.</p>
      </div>
      <div class="header-actions">
        <div class="theme-toggle-wrap">
          <div class="styles-bubble" id="styles-callout" role="status" aria-label="Try design styles">
            <p class="styles-bubble__text">Try <strong>Styles</strong> — the best part</p>
            <button type="button" class="styles-bubble__dismiss" id="styles-callout-dismiss" aria-label="Dismiss tip">×</button>
            <span class="styles-bubble__tail" aria-hidden="true"></span>
          </div>
          <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Cycle design theme" title="Next theme">
            <span class="theme-toggle__track" aria-hidden="true">
              <span class="theme-toggle__thumb" id="theme-toggle-thumb"></span>
            </span>
            <span class="theme-toggle__copy">
              <span class="theme-toggle__hint">Style</span>
              <span class="theme-toggle__label" id="theme-toggle-label">Midnight</span>
            </span>
          </button>
        </div>
        <nav class="header-links" aria-label="External profiles">
          <a href="https://github.com/pfaustino" class="header-link" target="_blank" rel="noopener noreferrer">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/></svg>
            GitHub
          </a>
          <a href="https://pfaustino.itch.io" class="header-link" target="_blank" rel="noopener noreferrer">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 2C3.67 2 3 2.67 3 3.5v17c0 .83.67 1.5 1.5 1.5h15c.83 0 1.5-.67 1.5-1.5v-17c0-.83-.67-1.5-1.5-1.5h-15zm8.28 5.28c.39-.39 1.02-.39 1.41 0l4.5 4.5c.39.39.39 1.02 0 1.41l-4.5 4.5a.996.996 0 0 1-1.41-1.41L15.59 12l-3.3-3.31a.996.996 0 0 1 0-1.41z"/></svg>
            itch.io
          </a>
        </nav>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="stats-bar" id="stats-bar" aria-label="Portfolio summary"></section>

    <section class="controls" aria-label="Filter projects">
      <div class="filter-group" role="group" aria-label="Category filter" id="category-filters">
        <button type="button" class="filter-btn active" data-filter="all">All</button>
        <button type="button" class="filter-btn" data-filter="game">Games</button>
        <button type="button" class="filter-btn" data-filter="app">Apps</button>
        <button type="button" class="filter-btn" data-filter="prototype">Prototypes</button>
      </div>
      <label class="search-wrap">
        <span class="visually-hidden">Search projects</span>
        <input type="search" id="search" placeholder="Search projects…" autocomplete="off" />
      </label>
    </section>

    <section class="featured-section" id="featured-section" hidden>
      <h2 class="section-title">Featured</h2>
      <div class="project-grid featured-grid" id="featured-grid"></div>
    </section>

    <section class="projects-section">
      <h2 class="section-title" id="projects-heading">All Projects</h2>
      <div class="project-grid" id="project-grid" role="list"></div>
      <p class="empty-state" id="empty-state" hidden>No projects match your search.</p>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>Built by <a href="https://github.com/pfaustino">@pfaustino</a> · Source on <a href="https://github.com/pfaustino/portfolio">GitHub</a></p>
    </div>
  </footer>

  <script src="js/app.js" type="module"></script>
</body>
</html>
